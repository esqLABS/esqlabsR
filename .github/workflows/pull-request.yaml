name: Pull Request Workflow

# Runs on every pull request. A development version installs its OSP
# dependencies from their GitHub `Remotes`; a release version has no `Remotes`
# and installs them from the OSP R-universe listed in `Additional_repositories`.
# The release-pr and dev-pr workflows switch these fields. setup-r-env, used by
# every check, fails when they do not match the Version and explains the fix.
#
# Every check passes the OSP R-universe as an extra repository: ospsuite pulls
# in packages that are not on CRAN (ospsuite.plots, tlf), and pak does not read
# a dependency's own Additional_repositories, so without it dependency
# resolution fails before any check runs.

on:
  pull_request:

permissions: read-all

jobs:
  R-CMD-Check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-build.yaml@main
    with:
      setup-quarto: true
      extra-packages: local::.
      extra-repositories: https://open-systems-pharmacology.r-universe.dev

  test-coverage:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/test-coverage.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lychee-link-check:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/Check_URLs.yml@main

  pkgdown:
    permissions:
      contents: write # required by the pkgdown reusable workflow (no deploy on PRs)
      pull-requests: read # the workflow's check-changes job reads PR file changes
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/pkgdown.yaml@main
    with:
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
