name: Dev PR

# Manually open a "restore development mode" pull request: runs
# usethis::use_dev_version() (Version x.y.z -> x.y.z.9000 and a new NEWS.md
# development heading), then opens a `dev-pr-<version>` PR. Run after a release,
# or on demand. The workflow's Remotes-unpinning step is a no-op here: OSP
# dependencies come from the R-universe, not from a `Remotes:` field.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dev-pr:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/dev-pr.yaml@main
    with:
      client-id: ${{ vars.ACTIONS_MANAGER_CLIENTID }}
    secrets:
      private-key: ${{ secrets.ACTIONS_MANAGER_TOKEN }}
