name: Check against released dependencies

# Nightly R-CMD-check against the latest *released* OSP dependencies: the
# reusable workflow pins Remotes to @*release before checking. Complements
# check-dev-deps.yaml, which checks against the current (development) deps.

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3 AM UTC daily
  workflow_dispatch:

permissions: read-all

jobs:
  check-released-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-released-deps.yaml@main
    with:
      # plot-results.qmd is a Quarto vignette. Quarto renders it in its own R
      # session, which resolves esqlabsR from the library rather than from the
      # package under check, so the other check workflows pair this with
      # `extra-packages: local::.`. This reusable workflow declares no such
      # input, so the vignette build here can still fail on platforms where the
      # check library is not on the render session's path.
      setup-quarto: true
