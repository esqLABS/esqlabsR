name: Check against released dependencies

# Nightly R-CMD-check against the latest *released* OSP dependencies: the
# reusable workflow pins Remotes to @*release before checking. Complements
# check-dev-deps.yaml, which checks against the current (development) deps.

on:
  schedule:
    - cron: '0 3 * * *' # Run at 3 AM UTC daily
  workflow_dispatch:

permissions: read-all

jobs:
  check-released-deps:
    uses: Open-Systems-Pharmacology/Workflows/.github/workflows/R-CMD-check-released-deps.yaml@main
    with:
      # ubuntu-latest is ubuntu-26.04, which has no libxml2.so.2, so ospsuite
      # cannot load its .NET assemblies. Pin Ubuntu to 24.04 until it can.
      os-matrix: >-
        [{"os": "${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-24.04' }}", "r": "release"},
        {"os": "${{ vars.GHA_DEFAULT_RUNNER_MACOS || 'macos-latest' }}", "r": "release"}]
      extra-repositories: https://open-systems-pharmacology.r-universe.dev
