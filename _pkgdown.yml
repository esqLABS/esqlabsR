url: https://esqlabs.github.io/esqlabsR/
template:
  bootstrap: 5
authors:
  esqLABS GmbH:
    href: https://esqlabs.com/
    html:
      <img src='https://esqlabs.github.io/esqlabsR/reference/figures/circles.png'
      style='max-width:33px'>esqLABS
  Indrajeet Patil:
    href: https://sites.google.com/site/indrajeetspatilmorality/
  Felix Mil:
    href: https://github.com/Felixmil
development:
  mode: auto
reference:
  - title: Project workflow
    contents:
      - contains("Project")
      - contains("Scenario")
      - projectConfigurationStatus
      - createPlotsFromExcel
      - initProject
  - title: Programmatic Project mutation
    contents:
      - addScenario
      - removeScenario
      - addIndividual
      - removeIndividual
      - setIndividualParameterSets
      - addPopulation
      - removePopulation
      - addApplication
      - removeApplication
      - setApplicationParameterSets
      - addOutputPath
      - removeOutputPath
      - addObservedData
      - removeObservedData
      - getObservedDataNames
      - addDataCombined
      - removeDataCombined
      - addPlot
      - removePlot
      - addPlotGrid
      - removePlotGrid
      - addModelParameterSet
      - removeModelParameterSet
      - addModelParameterEntry
      - removeModelParameterEntry
      - addIndividualParameterSet
      - removeIndividualParameterSet
      - addIndividualParameterSetEntry
      - removeIndividualParameterSetEntry
      - addApplicationParameterSet
      - removeApplicationParameterSet
      - addApplicationParameterSetEntry
      - removeApplicationParameterSetEntry
  - title: Parameter identification workflow
    contents:
      - runPI
      - addPITask
      - removePITask
      - addPIParameter
      - removePIParameter
      - addPIOutputMapping
      - removePIOutputMapping
  - title: Deprecated parameter identification API
    desc: |
      Legacy entry points retained for migration only. They emit a
      deprecation warning and abort. Use the project-driven API above.
    contents:
      - createPITasks
  - title: Helpers for data import, wrangling, and export
    contents:
      - matches("^read")
      - matches("^extend")
      - matches("^set")
      - matches("^write")
      - matches("^export")
      - createDataCombinedFromExcel
  - title: Helpers for modeling and simulation
    contents:
      - matches("^compare")
      - matches("^calculate")
      - contains("Simulation")
      - ends_with("Function")
      - contains("Quantiles")
      - matches("^geo")
      - sampleRandomValue
      - applyIndividualParameters
      - Distributions
      - LLOQMode
      - ULOQMode
      - loadObservedData
      - loadObservedDataFromExcel
      - loadObservedDataFromPKML
  - title: Helpers for plotting
    contents:
      - matches("^plot")
      - matches("^col")
      - matches("[Cc]olor")
      - has_concept("create-plotting-configurations")
      - createDataCombined
      - createPlots
      - createDataCombinedFromExcel
      - createPlotsFromExcel
  - title: Input validation
    contents:
      - matches("^valid")
      - matches("^is")
      - stringToNum
      - GenderInt
      - contains("Types")
  - title: Sensitivity analysis
    contents: matches("[Ss]ensitivity")
  - title: Shiny applications
    contents: matches("^start")
  - title: Miscellaneous
    contents:
      - matches("^enum")
      - matches("^get")
      - executeInParallel
      - pathFromClipboard
      - removeFromList
      - sourceAll
      - esqlabsRSettingNames
  - title: Inherited classes
    contents: ExportConfiguration
articles:
  - title: esqlabsR Workflow
    navbar: esqlabsR Workflow
    contents:
      - workflow-overview
      - project-structure
      - design-scenarios
      - run-simulations
      - plot-results
      - sensitivity
      - sensitivity-plots
  - title: Parameter Identification
    navbar: Parameter Identification
    contents:
      - pi-workflow
  - title: Miscellaneous
    navbar: Miscellaneous
    contents:
      - presentations
      - advanced
      - project-migration-guide
