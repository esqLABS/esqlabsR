url: https://esqlabs.github.io/esqlabsR/
template:
  bootstrap: 5
authors:
  esqLABS GmbH:
    href: https://esqlabs.com/
    html:
      <img src='https://esqlabs.github.io/esqlabsR/reference/figures/circles.png'
      style='max-width:33px'>esqLABS
  Indrajeet Patil:
    href: https://sites.google.com/site/indrajeetspatilmorality/
  Felix Mil:
    href: https://github.com/Felixmil
development:
  mode: auto
reference:
  - title: Project workflow
    contents:
      - Project
      - loadProject
      - saveProject
      - reloadProject
      - snapshotProject
      - restoreProject
      - syncStatus
      - initProject
      - exampleProjectPath
      - importProjectFromExcel
      - exportProjectToExcel
      - projectStatus
      - createScenariosFromPKML
      - contains("Scenario")
  - title: Programmatic Project mutation
    contents:
      - addScenario
      - removeScenario
      - setScenario
      - renameScenario
      - duplicateScenario
      - addIndividual
      - removeIndividual
      - setIndividual
      - addPopulation
      - removePopulation
      - setPopulation
      - addApplication
      - removeApplication
      - setApplicationParameterSets
      - addOutputPath
      - removeOutputPath
      - setOutputPath
      - addObservedData
      - removeObservedData
      - getObservedDataNames
      - addDataCombined
      - removeDataCombined
      - addPlot
      - removePlot
      - addPlotGrid
      - removePlotGrid
      - addParameterSet
      - removeParameterSet
      - addParameterEntry
      - removeParameterEntry
      - addInitialConditions
      - removeInitialConditions
      - addInitialConditionEntry
      - removeInitialConditionEntry
  - title: Parameter identification workflow
    contents:
      - PITask
      - PIParameter
      - PIOutputMapping
      - runPI
      - addPITask
      - removePITask
      - addPIParameter
      - removePIParameter
      - addPIOutputMapping
      - removePIOutputMapping
  - title: Deprecated parameter identification API
    desc: |
      Legacy entry points retained for migration only. They emit a
      deprecation warning and abort. Use the project-driven API above.
    contents:
      - createPITasks
  - title: Helpers for data import, wrangling, and export
    contents:
      - matches("^read")
      - matches("^extend")
      - matches("^set")
      - matches("^write")
      - matches("^export")
  - title: Helpers for modeling and simulation
    contents:
      - matches("^compare")
      - matches("^calculate")
      - contains("Simulation")
      - ends_with("Function")
      - contains("Quantiles")
      - matches("^geo")
      - sampleRandomValue
      - applyIndividualParameters
      - Distributions
      - LLOQMode
      - ULOQMode
      - loadObservedData
  - title: Helpers for plotting
    contents:
      - matches("^plot")
      - matches("^col")
      - matches("[Cc]olor")
      - has_concept("create-plotting-configurations")
      - createDataCombined
      - createPlots
  - title: Input validation
    contents:
      - matches("^valid")
      - matches("^is")
      - print.ValidationResults
      - format.ValidationResults
      - stringToNum
      - GenderInt
      - contains("Types")
  - title: Sensitivity analysis
    contents: matches("[Ss]ensitivity")
  - title: Shiny applications
    contents: matches("^start")
  - title: Miscellaneous
    contents:
      - matches("^enum")
      - matches("^get")
      - executeInParallel
      - pathFromClipboard
      - removeFromList
      - sourceAll
      - esqlabsRSettingNames
  - title: Deprecated
    desc: |
      Legacy entry points retained for migration only. They emit a
      deprecation warning. Use the new project-driven API above.
    contents:
      - ProjectConfiguration
      - createProjectConfiguration
      - exampleProjectConfigurationPath
      - snapshotProjectConfiguration
      - restoreProjectConfiguration
      - projectConfigurationStatus
      - createDataCombinedFromExcel
      - createPlotsFromExcel
articles:
  - title: Workflow
    navbar: Workflow
    contents:
      - esqlabsR
      - projects
      - design-scenarios
      - validate-project
      - run-simulations
      - plot-results
      - observed-data
  - title: Parameter identification
    navbar: Parameter identification
    contents:
      - pi-workflow
  - title: Sensitivity analysis
    navbar: Sensitivity analysis
    contents:
      - sensitivity
      - sensitivity-plots
  - title: Miscellaneous
    navbar: Miscellaneous
    contents:
      - migrate-from-excel
      - presentations
